<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" width="200" height="200">
  <!-- Pin body -->
  <path d="M32 4 C20 4 12 13 12 23 C12 37 32 60 32 60 C32 60 52 37 52 23 C52 13 44 4 32 4 Z" fill="#e74c3c"/>
  <!-- Pin inner circle -->
  <circle cx="32" cy="23" r="11" fill="white"/>
  <!-- Three lockers -->
  <!-- Left locker -->
  <rect x="22" y="15" width="6" height="15" rx="0.5" fill="#e74c3c"/>
  <!-- Center locker -->
  <rect x="29" y="15" width="6" height="15" rx="0.5" fill="#e74c3c"/>
  <!-- Right locker -->
  <rect x="36" y="15" width="6" height="15" rx="0.5" fill="#e74c3c"/>
  <!-- Divider lines between lockers (white) -->
  <line x1="28.5" y1="15" x2="28.5" y2="30" stroke="white" stroke-width="0.8"/>
  <line x1="35.5" y1="15" x2="35.5" y2="30" stroke="white" stroke-width="0.8"/>
  <!-- Horizontal vent lines (white) on each locker -->
  <line x1="23" y1="18" x2="27" y2="18" stroke="white" stroke-width="0.8"/>
  <line x1="30" y1="18" x2="34" y2="18" stroke="white" stroke-width="0.8"/>
  <line x1="37" y1="18" x2="41" y2="18" stroke="white" stroke-width="0.8"/>
  <!-- Handles/locks -->
  <circle cx="25" cy="23" r="1" fill="white"/>
  <circle cx="32" cy="23" r="1" fill="white"/>
  <circle cx="39" cy="23" r="1" fill="white"/>
</svg>
