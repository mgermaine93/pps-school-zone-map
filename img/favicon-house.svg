<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" width="200" height="200">
  <!-- Chimney -->
  <rect x="42" y="10" width="5" height="14" fill="#e74c3c"/>

  <!-- Main roof -->
  <polygon points="6,32 32,8 58,32" fill="#e74c3c"/>

  <!-- House body -->
  <rect x="10" y="31" width="44" height="27" fill="#e74c3c"/>

  <!-- Left window -->
  <rect x="14" y="37" width="10" height="9" rx="1" fill="white"/>
  <!-- Left window cross -->
  <line x1="19" y1="37" x2="19" y2="46" stroke="#e74c3c" stroke-width="1.5"/>
  <line x1="14" y1="41.5" x2="24" y2="41.5" stroke="#e74c3c" stroke-width="1.5"/>

  <!-- Right window -->
  <rect x="40" y="37" width="10" height="9" rx="1" fill="white"/>
  <!-- Right window cross -->
  <line x1="45" y1="37" x2="45" y2="46" stroke="#e74c3c" stroke-width="1.5"/>
  <line x1="40" y1="41.5" x2="50" y2="41.5" stroke="#e74c3c" stroke-width="1.5"/>

  <!-- Door -->
  <rect x="27" y="44" width="10" height="14" fill="white"/>
  <!-- Door knob -->
  <circle cx="35" cy="51" r="1" fill="#e74c3c"/>
</svg>
